name: Claude Code Review

on:
  workflow_call:
    inputs:
      debug:
        description: Keep Claude's execution log as a build artifact
        type: boolean
        default: false

# Queue rather than cancel. A push mid-review fires `synchronize`, whose run
# skips the review step and reports success in seconds; with nothing
# serializing the two, that green lands on the new head commit while the real
# review is still working on the old one, and the PR reads as reviewed and is
# free to auto-merge before a single finding is posted. Queued, the check stays
# pending until the review finishes.
#
# `cancel-in-progress: true` would be worse than the race it fixes: it kills
# the only review the PR gets and greens the check anyway, leaving the
# half-ticked progress comment behind with no run to finish it.
#
# `inputs.debug` is in the group per the usual rule (see rust-ci.yml) —
# `github.workflow` is the caller's name, so it alone does not identify a call.
concurrency:
  group: ${{ github.workflow }}-claude-code-review-${{ inputs.debug }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Review the PR as opened, not every follow-up push: `synchronize` fires
        # on each push to the branch, and the fixups after an initial review
        # rarely warrant a second full pass. Callers keep `synchronize` in their
        # trigger types so the job still runs and reports success on the new head
        # commit, which a required status check needs. To re-review on demand,
        # comment `@claude review this PR` — claude.yml picks that up.
        #
        # Dependency PRs are skipped entirely. In both cases the step is skipped
        # rather than the job, so the job still reports success.
        if: >
          github.event.action != 'synchronize' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !(github.event.pull_request.user.login == 'jluszcz' && startsWith(github.event.pull_request.head.ref, 'Deps-'))
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude'
          track_progress: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Dispatch every review agent with `run_in_background: false`, and do
            not end your turn until the findings are posted. `Agent` launches
            asynchronously unless told otherwise, and this is a one-shot
            headless run with no notification loop to wake you when a background
            agent finishes — so ending your turn to wait for one kills it, and
            the review exits green having posted only its progress checklist.
          # `Skill` is what runs the slash command in `prompt` above. Without
          # it that first call is denied, the plugin command never loads, and
          # what remains is a model improvising a review from the bare prompt
          # string — no five-agent procedure, no confidence filter, and no
          # instruction to post the result with `gh pr comment`.
          #
          # `git fetch` is here because the checkout is `fetch-depth: 1`, so
          # `origin/main` does not exist in the workspace and every
          # `git log origin/main..HEAD` fails until something fetches it.
          #
          # Subagent dispatch needs no entry: the tool is `Agent`, and it is
          # not permission-gated.
          claude_args: |
            --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(git fetch:*),Bash(git blame:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*)"

      # The action hides the turn stream, and rerunning with Actions debug
      # logging does not unhide it, so a review that ends green having posted
      # only its progress checklist leaves nothing to diagnose. Turning this
      # on keeps the stream: every tool call Claude made, and a
      # `permission_denials` entry per blocked call carrying the tool name and
      # the input it was called with.
      #
      # Off by default because the log is the whole review verbatim — the
      # diff, the file contents Claude read, and its own reasoning about them.
      # Enable it on the caller for as long as a review is misbehaving, then
      # turn it back off.
      - name: Upload execution log
        if: always() && inputs.debug && steps.claude-review.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-log
          path: ${{ steps.claude-review.outputs.execution_file }}
          if-no-files-found: error
          retention-days: 7

      # A review that ends its turn early still exits zero: the action's
      # success contract is that the CLI process exited cleanly, not that a
      # review was posted. Run 33930744755 on MisterManager#90 ended
      # `{"subtype": "success", "is_error": false, "num_turns": 19}` after 91
      # seconds, having ticked three of six boxes and posted no findings, and
      # the PR carried a green check. This step is what makes that red.
      #
      # `track_progress` posts one comment per run and rewrites it in place, so
      # the checklist in it is the record of how far Claude got: every box
      # ticked means it reached "Post findings". Only the leading checklist
      # block is examined — findings prose below it may contain `- [ ]` of its
      # own.
      #
      # A missing comment is not a failure. `claude-code-action` skips itself
      # when the PR edits this workflow file (see `README.md`), reporting
      # success without ever commenting; there is no review to verify.
      - name: Verify the review was posted
        if: always() && steps.claude-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_MARKER: actions/runs/${{ github.run_id }}
        run: |
          # SC2016: `$ENV.RUN_MARKER` is jq reading the environment, not shell
          # interpolation — the single quotes are what keep it that way.
          # shellcheck disable=SC2016
          comment=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq 'map(select(.body | contains($ENV.RUN_MARKER))) | .[0] // empty')

          if [ -z "$comment" ]; then
            echo "No tracking comment for this run — nothing to verify."
            exit 0
          fi

          url=$(printf '%s' "$comment" | jq -r '.html_url')
          checklist=$(printf '%s' "$comment" | jq -r '.body' | sed -n '/^- \[/,/^$/p')

          if printf '%s\n' "$checklist" | grep -q '^- \[ \]'; then
            printf '%s\n' "$checklist"
            echo "::error::Claude stopped before posting its review. Unfinished checklist: ${url}"
            echo "Re-run by commenting '@claude review this PR', or set 'debug: true' on the caller to keep the turn stream and see where it stopped."
            exit 1
          fi

          echo "Review checklist complete: ${url}"
