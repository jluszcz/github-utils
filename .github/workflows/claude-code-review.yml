name: Claude Code Review

on:
  workflow_call:
    inputs:
      debug:
        description: Keep Claude's execution log as a build artifact
        type: boolean
        default: false

# Queue rather than cancel. A push mid-review fires `synchronize`, whose run
# skips the review step and reports success in seconds; with nothing
# serializing the two, that green lands on the new head commit while the real
# review is still working on the old one, and the PR reads as reviewed and is
# free to auto-merge before a single finding is posted. Queued, the check stays
# pending until the review finishes. `cancel-in-progress: true` would be worse:
# it kills the only review the PR gets and greens the check anyway.
#
# `inputs.debug` is in the group per the usual rule (see rust-ci.yml) —
# `github.workflow` is the caller's name, so it alone does not identify a call.
concurrency:
  group: ${{ github.workflow }}-claude-code-review-${{ inputs.debug }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Review the PR as opened, not every follow-up push: `synchronize` fires
        # on each push to the branch, and the fixups after an initial review
        # rarely warrant a second full pass. Callers keep `synchronize` in their
        # trigger types so the job still runs and reports success on the new head
        # commit, which a required status check needs. To re-review on demand,
        # comment `@claude review this PR` — claude.yml picks that up.
        #
        # Dependency PRs are skipped entirely. In both cases the step is skipped
        # rather than the job, so the job still reports success.
        if: >
          github.event.action != 'synchronize' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !(github.event.pull_request.user.login == 'jluszcz' && startsWith(github.event.pull_request.head.ref, 'Deps-'))
        uses: anthropics/claude-code-action@6c690188da61cf16ee7debb28383ba67f02abb4c # v1.0.242
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `--comment` posts the findings to the PR; without it the review
          # only prints to the job log.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action hides the turn stream, and rerunning with Actions debug
      # logging does not unhide it, so a review that ends green without posting
      # anything leaves nothing to diagnose. Turning this on keeps the stream:
      # every tool call Claude made, and a `permission_denials` entry per
      # blocked call carrying the tool name and the input it was called with.
      #
      # Off by default because the log is the whole review verbatim — the
      # diff, the file contents Claude read, and its own reasoning about them.
      # Enable it on the caller for as long as a review is misbehaving, then
      # turn it back off.
      - name: Upload execution log
        if: always() && inputs.debug && steps.claude-review.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-log
          path: ${{ steps.claude-review.outputs.execution_file }}
          if-no-files-found: error
          retention-days: 7
