name: Claude Code Review

on:
  workflow_call:

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Review the PR as opened, not every follow-up push: `synchronize` fires
        # on each push to the branch, and the fixups after an initial review
        # rarely warrant a second full pass. Callers keep `synchronize` in their
        # trigger types so the job still runs and reports success on the new head
        # commit, which a required status check needs. To re-review on demand,
        # comment `@claude review this PR` — claude.yml picks that up.
        #
        # Dependency PRs are skipped entirely. In both cases the step is skipped
        # rather than the job, so the job still reports success.
        if: >
          github.event.action != 'synchronize' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !(github.event.pull_request.user.login == 'jluszcz' && startsWith(github.event.pull_request.head.ref, 'Deps-'))
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude'
          track_progress: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # `Skill` is what runs the slash command in `prompt` above. Without
          # it that first call is denied, the plugin command never loads, and
          # what remains is a model improvising a review from the bare prompt
          # string — no five-agent procedure, no confidence filter, and no
          # instruction to post the result with `gh pr comment`.
          #
          # `git fetch` is here because the checkout is `fetch-depth: 1`, so
          # `origin/main` does not exist in the workspace and every
          # `git log origin/main..HEAD` fails until something fetches it.
          #
          # Subagent dispatch needs no entry: the tool is `Agent`, and it is
          # not permission-gated.
          claude_args: |
            --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(git fetch:*),Bash(git blame:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*)"
