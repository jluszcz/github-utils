# Fails when .github/workflows/actions.lock is out of sync with the caller's
# workflows, or a locked pin no longer verifies upstream.

name: Actions Lockfile

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  # No inputs, so one call per caller; see rust-ci.yml for the usual rule.
  group: ${{ github.workflow }}-actions-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Lockfile
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # The extension is pre-1.0 and its lockfile format still changes between
      # releases, so it is pinned and bumped deliberately.
      GH_ACTIONS_LOCK_VERSION: v0.4.1

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"

      - name: Verify
        run: gh actions-lock --verify
