name: Deploy Lambda

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
      project:
        required: true
        type: string
      regional:
        description: Append .${aws-region} to the IAM role name
        type: boolean
        default: false

    secrets:
      aws-account-id:
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  # Include the inputs that identify the deploy target: in a called workflow
  # github.workflow is the *caller's* name, so two deploy jobs in one caller
  # (e.g. per-region) would otherwise share a group and cancel each other.
  group: ${{ github.workflow }}-deploy-lambda-${{ inputs.project }}-${{ inputs.aws-region }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      AWS_BUCKET: code-${{ secrets.aws-account-id }}-${{ inputs.aws-region }}-an
      PROJECT: ${{ inputs.project }}

    steps:
      - name: Download Package
        uses: actions/download-artifact@v8
        with:
          name: package

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.aws-account-id }}:role/${{ inputs.project }}.github-deploy${{ inputs.regional && format('.{0}', inputs.aws-region) || '' }}
          role-session-name: github-deploy
          aws-region: ${{ inputs.aws-region }}

      - name: Upload Package
        run: aws s3 cp "$PROJECT.zip" "s3://$AWS_BUCKET/"

      - name: Update Function Code
        env:
          FUNCTION_NAME: ${{ inputs.project }}
        run: |
          for attempt in 1 2 3; do
            if err=$(aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --s3-bucket "$AWS_BUCKET" \
              --s3-key "$PROJECT.zip" \
              --no-cli-pager 2>&1 >/dev/null); then
              break
            fi
            printf '%s\n' "$err" >&2
            case "$err" in
              *ResourceConflictException*)
                if [ "$attempt" -eq 3 ]; then
                  exit 1
                fi
                sleep $(( 1 << (attempt - 1) ))
                ;;
              *) exit 1 ;;
            esac
          done
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
