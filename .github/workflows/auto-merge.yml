name: Auto-Merge

on:
  workflow_call:
    secrets:
      # Uppercase to match the caller's own repository-secret names: under
      # `secrets: inherit` a caller's secrets arrive under those names, so
      # declaring them here costs callers no YAML. Optional because releasing
      # moves v2 and every @v2 caller takes this file before it has secrets.
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      (github.event.pull_request.user.login == 'jluszcz' && startsWith(github.event.pull_request.head.ref, 'Deps-'))

    permissions:
      contents: write
      pull-requests: write

    steps:
      # The `secrets` context is not available in an `if:` expression, so the
      # presence check has to round-trip through env and a step output.
      - name: Check for App credentials
        id: creds
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint App token
        id: app-token
        if: steps.creds.outputs.present == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # GitHub creates no workflow runs for events triggered by GITHUB_TOKEN, so
      # merging with it produces no push and no `pull_request: closed` run. An
      # App-triggered merge is a real event. A repo without the secrets falls
      # back and keeps the inert behavior — degraded, not broken.
      #
      # GitHub refuses to enable auto-merge on a PR that is already mergeable
      # ("Pull request is in clean/unstable status"), which happens whenever
      # every required check finishes before the API call lands. Merge directly
      # in that case, but only once `gh pr checks --required` confirms the
      # required checks passed: it exits non-zero while one is pending or
      # failed, and when the repo has none, so a repo without required checks
      # never merges ahead of its CI.
      - name: Enable auto-merge
        run: |
          if gh pr merge --auto --squash "$PR_URL"; then
            exit 0
          fi
          gh pr checks "$PR_URL" --required
          gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
