name: CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      # The Python job tests and lints scripts/, so main needs coverage when
      # those — or the project files the job installs from — change.
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.pre-commit-config.yaml'

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint Workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: actionlint
        uses: raven-actions/actionlint@v2.2.0

  python:
    name: Python
    uses: ./.github/workflows/python-ci.yml

  actions-lock:
    name: Actions Lockfile
    uses: ./.github/workflows/actions-lock.yml
